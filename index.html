<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mimunity</title>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="js/config.js"></script>
    <script defer src="js/utils.js"></script>
    <script defer src="js/notification.js"></script>
    <script defer src="js/app.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/profile.js"></script>
    <script defer src="js/chat.js"></script>
    <script defer src="js/notebook.js"></script>
    <script defer src="js/avatarfx.js"></script>
    <link rel="manifest" href="manifest.json?v=1.4">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body onclick="hideUserMenu()">

<nav id="main-nav">
    <div class="nav-inner">
        <div class="brand" aria-label="mimunity">
            <img src="icon-192.png" alt="">
            <span>mimunity</span>
        </div>
        <div class="nav-links">
            <a onclick="showPage('home')" id="nav-home"><span class="nav-icon">⌂</span><span>動態</span></a>
            <a onclick="showPage('chat')" id="nav-chat"><span class="nav-icon">◌</span><span>聊天</span></a>
            <a onclick="showPage('profile')" id="nav-profile"><span class="nav-icon">●</span><span>檔案</span></a>
            <a onclick="showPage('avatarfx')" id="nav-avatarfx"><span class="nav-icon">✦</span><span>特效</span></a>
            <a onclick="toggleNotification()" id="notif-btn"><span class="nav-icon">♢</span><span>通知</span></a>
        </div>
    </div>
</nav>

<div class="container">
    <div id="page-login" class="card auth-card active">
        <div class="auth-brand"><img src="icon-192.png" alt=""><span>mimunity</span></div>
        <h1>歡迎回來</h1>
        <p class="auth-subtitle">登入後繼續和朋友分享日常</p>
        <input type="email" id="login-email" placeholder="Email" autocomplete="email">
        <input type="password" id="login-password" placeholder="密碼" autocomplete="current-password">
        <div id="login-error" class="form-error"></div>
        <button class="btn-primary" id="login-btn" onclick="handleLogin()">登入</button>
        <button class="btn-link" onclick="showPage('register')">還沒有帳號？建立帳號</button>
    </div>

    <div id="page-register" class="card auth-card">
        <div class="auth-brand"><img src="icon-192.png" alt=""><span>mimunity</span></div>
        <h1>建立新帳號</h1>
        <p class="auth-subtitle">加入屬於你和朋友的小天地</p>
        <input type="email" id="reg-email" placeholder="Email" autocomplete="email">
        <input type="password" id="reg-password" placeholder="設定密碼" autocomplete="new-password">
        <div id="register-error" class="form-error"></div>
        <button class="btn-primary btn-success" onclick="handleSignUp()">註冊</button>
        <button class="btn-link" onclick="showPage('login')">已經有帳號？返回登入</button>
    </div>

    <div id="page-home" class="card page-surface feed-page">
        <header class="page-header">
            <div>
                <p class="eyebrow">首頁動態</p>
                <h1 id="welcome-msg">今天想分享些什麼？</h1>
            </div>
        </header>
        <div class="composer">
            <textarea id="post-content" rows="3" placeholder="分享新鮮事..."></textarea>
            <div class="composer-actions">
                <label class="file-action" for="post-file"><span>＋</span>加入圖片</label>
                <input type="file" id="post-file" accept="image/*">
                <button class="btn-primary compact" onclick="handleCreatePost()">發佈</button>
            </div>
        </div>
        <div id="posts-list"></div>
    </div>

    <div id="page-chat" class="card page-surface chat-page">
        <header class="page-header compact-header">
            <div><p class="eyebrow">訊息</p><h1 id="chat-title">公共聊天大廳</h1></div>
        </header>
        <div id="user-list" class="people-strip"></div>
        <div id="chat-box"></div>
        <div class="chat-composer">
            <input type="text" id="chat-input" placeholder="說點什麼... (可用 ||隱藏文字||)">
            <div class="chat-actions">
                <div class="chat-options">
                    <input type="file" id="chat-file">
                    <label><input type="checkbox" id="chat-is-spoiler"> 標記為防雷</label>
                </div>
                <button class="btn-primary compact" onclick="handleSendMessage()">傳送</button>
            </div>
        </div>
    </div>
   
    <div id="page-notebook" class="card page-surface notebook-page">
        <button class="notebook-back" onclick="goBackFromNotebook()" aria-label="返回上一頁">
            <span aria-hidden="true">←</span>
            <span>返回</span>
        </button>
        <header class="page-header notebook-header">
            <div><p class="eyebrow">私人空間</p><h1>好友記事本</h1><p id="notebook-friend-label">請從好友列表打開記事本</p></div>
            <div class="header-actions">
                <button class="btn-secondary" onclick="createNewNotebook('text')">＋ 文字記事</button>
                <button class="btn-primary compact" onclick="createNewNotebook('table')">＋ 表格記事</button>
            </div>
        </header>
        <div id="notebook-list"></div>
        <div id="notebook-editor" class="notebook-editor">
            <div class="editor-toolbar">
                <input type="text" id="notebook-title" placeholder="記事本標題">
                <button class="btn-primary compact" onclick="saveNotebook()">儲存</button>
                <button class="btn-secondary" onclick="closeNotebookEditor()">取消</button>
            </div>
            <div id="notebook-type-controls" class="editor-type"></div>
            <div id="notebook-text-area" class="editor-area">
                <textarea id="notebook-content" rows="10" placeholder="輸入記事內容..."></textarea>
            </div>
            <div id="notebook-table-area" class="editor-area">
                <div class="table-controls">
                    <label>列 <input type="number" id="notebook-table-rows" min="1" value="3"></label>
                    <label>欄 <input type="number" id="notebook-table-cols" min="1" value="3"></label>
                    <button class="btn-secondary" onclick="buildNotebookTable()">建立表格</button>
                </div>
                <div id="notebook-table-editor"></div>
            </div>
        </div>
    </div>

    <div id="page-profile" class="card page-surface profile-page">
        <div class="profile-hero">
            <div class="profile-accent"></div>
            <div class="avatar-wrapper preview-avatar profile-avatar">
                <img id="p-img" src="icon-192.png" onerror="this.onerror=null;this.src='icon-192.png'">
                <img id="p-img-effect" class="avatar-decoration" src="" style="display:none;">
            </div>
            <h1 id="profile-display-title">個人檔案</h1>
        </div>
        <div id="profile-edit-area">
            <div class="avatar-upload-row">
                <input type="file" id="avatar-file" accept="image/*">
                <button class="btn-secondary" onclick="handleAvatarUpload()">上傳新頭像</button>
            </div>
            <label class="field-label" for="username">顯示名稱</label>
            <input type="text" id="username" placeholder="設定你的使用者名稱">
            <label class="field-label" for="bio">自我介紹</label>
            <textarea id="bio" placeholder="介紹一下自己..." rows="4"></textarea>
            <div class="profile-actions">
                <button class="btn-primary compact" onclick="saveProfile()">儲存更新</button>
                <button class="btn-danger-ghost" onclick="handleLogout()">登出</button>
            </div>
        </div>
        <div id="profile-view-area" class="profile-view">
            <h3 id="view-username"></h3>
            <p id="view-bio"></p>
            <div class="profile-actions centered">
                <button class="btn-primary compact" id="btn-quick-chat">發送私訊</button>
                <button class="btn-secondary" onclick="showPage('home')">返回首頁</button>
            </div>
        </div>
    </div>

    <div id="page-avatarfx" class="card page-surface fx-page">
        <header class="page-header centered-header"><div><p class="eyebrow">個人化</p><h1>頭像特效</h1><p>選擇一個喜歡的裝飾，立即預覽效果</p></div></header>
        <div class="fx-preview-stage">
            <div class="avatar-wrapper preview-avatar fx-preview-avatar">
                <img id="fx-preview-avatar" class="chat-avatar" src="icon-192.png">
                <img id="fx-preview-effect" class="avatar-decoration" src="" style="display:none;">
            </div>
        </div>
        <div class="fx-list">
            <div class="fx-item selected" data-fx="">
                <span class="fx-empty-label">無</span>
            </div>
            <div class="fx-item" data-fx="effects/fx1.svg">
                <img src="effects/fx1.svg" alt="fx1">
            </div>
            <div class="fx-item" data-fx="effects/fx2.svg">
                <img src="effects/fx2.svg" alt="fx2">
            </div>
            <div class="fx-item" data-fx="effects/fx3.svg">
                <img src="effects/fx3.svg" alt="fx3">
            </div>
            <div class="fx-item" data-fx="effects/fx4.svg">
                <img src="effects/fx4.svg" alt="fx4">
            </div>
            <div class="fx-item" data-fx="effects/fx5.svg">
                <img src="effects/fx5.svg" alt="fx5">
            </div>
            <div class="fx-item" data-fx="effects/fx6.svg">
                <img src="effects/fx6.svg" alt="fx6">
            </div>
            <div class="fx-item" data-fx="effects/effectsfx7.png">
                <img src="effects/effectsfx7.png" alt="fx7">
            </div>
        </div>
        <button class="btn-primary fx-save" onclick="saveAvatarFx()">套用特效</button>
    </div>
</div>

<div id="user-action-menu">
    <div class="menu-item" id="menu-view-profile">查看個人檔案</div>
    <div class="menu-item" id="menu-open-notebook">好友記事本</div>
    <div class="menu-item menu-primary" id="menu-start-chat">發送私訊</div>
</div>

</body>
</html>
